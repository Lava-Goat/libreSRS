# Contributor License Agreement check for the public GitHub repository (CLA Assistant Lite).
#
# On every pull request it checks that each commit author has signed CLA.md. An author who
# has not signed gets a comment asking them to reply, on the pull request, with exactly:
#   I have read the CLA Document and I hereby sign the CLA
# (the action's default sign text). The check passes once every author has signed; comment
# "recheck" to run it again. Signatures are kept in signatures/cla.json on the
# "cla-signatures" branch of this repository, written with the built-in GITHUB_TOKEN. That
# branch must exist and must not be protected; create it once as an orphan branch:
#   git switch --orphan cla-signatures && git commit --allow-empty -m "CLA signatures" && git push origin cla-signatures
# The check only blocks a merge when it is a required status check on main (branch protection).
# After a merge the action locks the pull request, so a signature comment cannot be edited away.
#
# The action is pinned to the commit of its v2.6.1 release tag, because pull_request_target
# runs with write access to this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Bot accounts cannot sign. "*[bot]" covers dependabot[bot], github-actions[bot],
          # renovate[bot] and any other GitHub App bot.
          allowlist: dependabot[bot],github-actions[bot],renovate[bot],*[bot]
